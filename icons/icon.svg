<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#4285f4"/>

  <!-- Notebook icon -->
  <rect x="35" y="30" width="58" height="70" fill="#ffffff" rx="4"/>
  <rect x="35" y="30" width="8" height="70" fill="#ea4335"/>

  <!-- Horizontal lines representing text -->
  <line x1="48" y1="45" x2="85" y2="45" stroke="#5f6368" stroke-width="2"/>
  <line x1="48" y1="55" x2="85" y2="55" stroke="#5f6368" stroke-width="2"/>
  <line x1="48" y1="65" x2="85" y2="65" stroke="#5f6368" stroke-width="2"/>
  <line x1="48" y1="75" x2="75" y2="75" stroke="#5f6368" stroke-width="2"/>

  <!-- Circular arrow for auto-update -->
  <g transform="translate(85, 85)">
    <circle cx="0" cy="0" r="20" fill="#34a853" opacity="0.95"/>
    <path d="M -8,-8 A 8,8 0 1,1 8,-8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="8,-8 12,-4 8,0" fill="#ffffff"/>
  </g>
</svg>
